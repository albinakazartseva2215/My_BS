# Запуск бэкенда сервиса записи «Тон» на сервере (Coolify читает этот
# файл сам — руками в панели ничего заполнять не нужно). Касается только
# server/ (HTTP API); у frontend/ и web/ свои дев-серверы раздачи статики,
# сюда не входят (см. server/DEPLOY.md).
#
# Секретов здесь нет намеренно: SESSION_SECRET приложение придумывает
# само при первом запуске и хранит на томе booking-data рядом с базой
# (server/src/config/env.js) — в файл описания класть его незачем, а
# закрытый репозиторий не повод: история хранит всё, доступ к ней рано
# или поздно получает кто-то ещё. Так же устроен и пароль первого
# администратора (server/src/db/ensureAdmin.js) — см. server/DEPLOY.md.

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # слева — порт снаружи контейнера (на него и заходить), справа —
      # порт, на котором слушает сам процесс (ENV PORT в server/Dockerfile).
      - "3000:3000"
    environment:
      # Включает проверку окружения на проде (server/src/config/env.js),
      # отключает server/src/db/seed.js и скрывает resetToken из ответа
      # API восстановления пароля (server/src/routes/auth.routes.js) —
      # без этой переменной приложение думает, что это дев-окружение.
      NODE_ENV: production
      # Не секрет — просто e-mail, под которым войдёт единственный админ,
      # заведённый автоматически при первом запуске на пустой базе (см.
      # server/src/db/ensureAdmin.js). Пароль к нему в этот файл не
      # попадает — он, как и SESSION_SECRET, придумывается сам и лежит
      # на томе booking-data, в admin-credentials.txt рядом с базой.
      ADMIN_EMAIL: admin@ton-salon.local
    volumes:
      # Файл базы (SQLite) — вне контейнера, на именованном томе, поэтому
      # переживает пересборку и обновление образа. Внутри контейнера он
      # виден по пути /data/database.sqlite (server/Dockerfile,
      # ENV DATABASE_FILE) — этот путь монтированием ниже и обеспечен.
      - booking-data:/data

volumes:
  # Именованный том, а не путь на хосте: Coolify создаёт и монтирует его
  # сам при первом деплое и переиспользует при каждом следующем — искать
  # и прописывать путь на сервере вручную не нужно.
  booking-data:
