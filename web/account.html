<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тон — личный кабинет</title>
<meta name="description" content="Ваши записи в салон «Тон».">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/landing.css">
<link rel="stylesheet" href="css/account.css">
</head>
<body>

<!-- ШАПКА — общая для всех страниц, разметку вставляет js/header.js -->
<div id="site-header-root"></div>

<main class="account-main">
  <div class="account-container">

    <div id="accountError" class="api-error" hidden></div>

    <div id="accountContent" aria-live="polite">
      <!-- заполняется js/account.js: заглушка → приветствие + записи из API,
           либо редирект на login.html, если сессии нет -->
      <div class="account-greeting">
        <div class="skeleton-line" style="width:56px;height:56px;border-radius:var(--radius-full)"></div>
        <div style="flex:1">
          <div class="skeleton-line" style="width:160px;height:20px;margin-bottom:8px"></div>
          <div class="skeleton-line" style="width:220px;height:14px"></div>
        </div>
      </div>
      <div class="skeleton-line" style="height:80px;border-radius:var(--radius-lg);margin-bottom:12px"></div>
      <div class="skeleton-line" style="height:80px;border-radius:var(--radius-lg)"></div>
    </div>

  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-grid">
      <div>
        <div class="footer-brand">
          <span class="footer-brand-mark" aria-hidden="true">Т</span>
          <span class="footer-brand-name">Тон</span>
        </div>
        <div class="footer-address">г. Москва, ул. Тверская, 12<br>Ежедневно, 10:00–21:00<br>+7 999 123-45-67</div>
      </div>
      <div>
        <div class="footer-heading">Навигация</div>
        <div class="footer-links"><a href="index.html#services">Услуги</a><a href="index.html#masters">Мастера</a><a href="index.html#reviews">Отзывы</a></div>
      </div>
      <div>
        <div class="footer-heading">Документы</div>
        <div class="footer-links"><a href="#">Политика конфиденциальности</a><a href="#">Публичная оферта</a></div>
      </div>
      <div>
        <div class="footer-heading">Соцсети</div>
        <div class="footer-links"><a href="#">ВКонтакте</a><a href="#">Telegram-канал</a></div>
      </div>
    </div>
    <div class="footer-bottom">© 2026 Салон красоты «Тон». Все права защищены.</div>
  </div>
</footer>

<script type="module" src="js/account.js"></script>
</body>
</html>
