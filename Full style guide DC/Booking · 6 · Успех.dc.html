<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fbf4eb; }
    a { color: #8d671d; }
    a:hover { color: #785300; }
    @media (max-width: 640px) {
      .sc-container { padding: 40px 16px 48px !important; }
    }
  </style>
</helmet>

<div style="font-family:'Manrope',sans-serif;background:#fbf4eb;color:#291c15;min-height:100vh;display:flex;align-items:center;justify-content:center">
  <div class="sc-container" style="max-width:480px;margin:0 auto;padding:64px 24px 56px;text-align:center;width:100%">

    <!-- CALM COMPOSITION -->
    <div style="position:relative;width:120px;height:120px;margin:0 auto 32px">
      <div style="position:absolute;inset:0;border-radius:42% 58% 61% 39% / 45% 40% 60% 55%;background:#f5e2c4"></div>
      <div style="position:absolute;inset:20px;border-radius:50%;background:#8d671d;display:flex;align-items:center;justify-content:center">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fdf8f1" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><polyline points="4,12 10,18 20,6"/></svg>
      </div>
    </div>

    <h1 style="font-family:'Playfair Display',serif;font-size:30px;font-weight:600;color:#291c15;margin:0 0 28px">Вы записаны</h1>

    <!-- VISIT CARD -->
    <div style="background:#fef9f3;border:1px solid #d6ccc4;border-radius:20px;padding:24px;margin-bottom:20px;text-align:left">
      <div style="font-family:'Playfair Display',serif;font-size:22px;font-weight:600;color:#291c15;margin-bottom:16px;font-variant-numeric:tabular-nums">18 августа, 14:00</div>

      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid #d6ccc4">
        <div style="width:44px;height:44px;border-radius:50%;background:#f4e4dd;color:#482a1d;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0">АС</div>
        <div><div style="font-size:14px;font-weight:700;color:#291c15">Анна Соколова</div><div style="font-size:12px;color:#796c65">Стрижка + окрашивание</div></div>
      </div>

      <div style="display:flex;justify-content:space-between;font-size:13px;color:#594941;margin-bottom:8px"><span>Длительность</span><span style="font-weight:700;color:#291c15;font-variant-numeric:tabular-nums">3 ч</span></div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid #d6ccc4;font-size:16px;font-weight:700;color:#291c15;margin-bottom:14px">
        <span>Сумма</span><span style="font-variant-numeric:tabular-nums">10 300 ₽</span>
      </div>

      <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:#796c65">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#796c65" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.5 7-11.5A7 7 0 005 9.5C5 14.5 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        г. Москва, ул. Тверская, 12
      </div>
    </div>

    <div style="font-size:13px;color:#796c65;margin-bottom:28px">Уведомление о записи придёт в личный кабинет</div>

    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px">
      <button style="padding:14px 24px;border-radius:999px;border:none;background:#482a1d;color:#fdf8f1;font-family:Manrope,sans-serif;font-size:15px;font-weight:700;cursor:pointer;min-height:44px">В личный кабинет</button>
      <button style="padding:14px 24px;border-radius:999px;border:1.5px solid #a4958c;background:transparent;color:#291c15;font-family:Manrope,sans-serif;font-size:15px;font-weight:700;cursor:pointer;min-height:44px">Добавить в календарь</button>
    </div>

    <a href="#" onClick="{{goStep1}}" style="font-size:13px;font-weight:600;text-decoration:none">Записаться ещё раз</a>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  goStep1 = () => { location.href = './Booking · 1 · Услуги.dc.html'; };

  renderVals() {
    return {
      goStep1: this.goStep1,
    };
  }
}
</script>
</body>
</html>
