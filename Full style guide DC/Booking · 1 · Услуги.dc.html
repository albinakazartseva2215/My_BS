<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fbf4eb; }
    a { color: #8d671d; }
    a:hover { color: #785300; }
    .sv-card:hover { border-color: #a4958c !important; box-shadow: 0 12px 24px rgba(72,42,29,0.14), 0 2px 6px rgba(72,42,29,0.08) !important; }
    @media (max-width: 640px) {
      .sv-container { padding: 0 16px 100px !important; }
      .sv-grid { grid-template-columns: 1fr !important; }
    }
    @media (min-width: 641px) {
      .sv-grid { grid-template-columns: repeat(2,1fr) !important; }
    }
  </style>
</helmet>

<div style="font-family:'Manrope',sans-serif;background:#fbf4eb;color:#291c15;min-height:100vh">

  <!-- FLOW HEADER -->
  <div style="max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:16px 24px 0">
    <span style="font-family:'Playfair Display',serif;font-size:16px;font-weight:600;color:#291c15">Тон</span>
    <button onClick="{{goHome}}" style="width:36px;height:36px;border-radius:50%;border:1px solid #d6ccc4;background:#fef9f3;color:#796c65;display:flex;align-items:center;justify-content:center;cursor:pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
    </button>
  </div>

  <!-- DEV STATE SWITCHER -->
  <div style="max-width:640px;margin:0 auto;padding:12px 24px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
    <button onClick="{{setDemo0}}" style="{{devBtn0}}">Ничего не выбрано</button>
    <button onClick="{{setDemo1}}" style="{{devBtn1}}">Одна услуга</button>
    <button onClick="{{setDemo2}}" style="{{devBtn2}}">Две услуги</button>
  </div>

  <div class="sv-container" style="max-width:640px;margin:0 auto;padding:0 24px 140px">

    <!-- STEPPER -->
    <div style="display:flex;align-items:center;margin-bottom:24px">
      <div style="display:flex;align-items:center;flex:1">
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
          <div style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;font-family:Manrope,sans-serif;background:#8d671d;color:#fdf8f1;box-shadow:0 0 0 4px #f5e2c4">1</div>
          <div style="font-size:12px;font-weight:600;color:#291c15">Услуги</div>
        </div>
        <div style="flex:1;height:2px;background:#d6ccc4;margin:0 8px;transform:translateY(-14px)"></div>
      </div>
      <div style="display:flex;align-items:center;flex:1">
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
          <div style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;font-family:Manrope,sans-serif;background:#f2eae0;color:#a59c98;border:1.5px solid #d6ccc4">2</div>
          <div style="font-size:12px;font-weight:600;color:#a59c98">Мастер</div>
        </div>
        <div style="flex:1;height:2px;background:#d6ccc4;margin:0 8px;transform:translateY(-14px)"></div>
      </div>
      <div style="display:flex;align-items:center;flex:1">
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
          <div style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;font-family:Manrope,sans-serif;background:#f2eae0;color:#a59c98;border:1.5px solid #d6ccc4">3</div>
          <div style="font-size:12px;font-weight:600;color:#a59c98">Время</div>
        </div>
        <div style="flex:1;height:2px;background:#d6ccc4;margin:0 8px;transform:translateY(-14px)"></div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
        <div style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;font-family:Manrope,sans-serif;background:#f2eae0;color:#a59c98;border:1.5px solid #d6ccc4">4</div>
        <div style="font-size:12px;font-weight:600;color:#a59c98">Подтверждение</div>
      </div>
    </div>

    <h1 style="font-family:'Playfair Display',serif;font-size:26px;font-weight:600;color:#291c15;margin:0 0 8px">Выберите услуги</h1>
    <p style="font-size:14px;color:#796c65;margin:0 0 20px;line-height:1.5">Можно выбрать несколько — мы подберём время с запасом</p>

    <!-- CATEGORY TABS -->
    <div style="display:flex;gap:4px;background:#f2eae0;border-radius:999px;padding:4px;margin-bottom:24px;width:fit-content;overflow-x:auto">
      <button onClick="{{setCat0}}" style="{{catStyle0}}">Стрижка</button>
      <button onClick="{{setCat1}}" style="{{catStyle1}}">Окрашивание</button>
      <button onClick="{{setCat2}}" style="{{catStyle2}}">Уход</button>
      <button onClick="{{setCat3}}" style="{{catStyle3}}">Укладка</button>
    </div>

    <!-- SERVICE GRID -->
    <div class="sv-grid" style="display:grid;gap:14px;margin-bottom:24px">
      <sc-for list="{{services}}" as="svc" hint-placeholder-count="4">
        <div onClick="{{svc.toggle}}" class="sv-card" style="{{svc.cardStyle}}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
            <div style="font-size:16px;font-weight:700;color:#291c15">{{svc.name}}</div>
            <span style="{{svc.checkStyle}}">✓</span>
          </div>
          <div style="font-size:13px;color:#796c65;margin-bottom:12px">{{svc.desc}}</div>
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div style="font-size:12px;color:#796c65;font-variant-numeric:tabular-nums">{{svc.duration}}</div>
            <div style="font-size:15px;font-weight:700;color:#291c15;font-variant-numeric:tabular-nums">{{svc.price}}</div>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="font-size:12px;color:#796c65;text-align:center">Оплата в салоне</div>
  </div>

  <!-- STICKY BOTTOM BAR -->
  <div style="position:sticky;bottom:0;left:0;right:0;background:#fef9f3;border-top:1px solid #d6ccc4;padding:16px 24px;box-shadow:0 -8px 24px rgba(72,42,29,0.08)">
    <div style="max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px">
      <button onClick="{{goHome}}" style="padding:13px 26px;border-radius:999px;border:1.5px solid #a4958c;background:transparent;color:#291c15;font-family:Manrope,sans-serif;font-size:14px;font-weight:700;cursor:pointer;min-height:44px;flex-shrink:0">Назад</button>

      <sc-if value="{{hasSelection}}" hint-placeholder-val="{{false}}">
        <div style="display:flex;align-items:center;gap:16px;flex:1;justify-content:flex-end">
          <div style="text-align:right">
            <div style="font-size:13px;color:#796c65">{{summaryCount}}</div>
            <div style="font-family:'Playfair Display',serif;font-size:20px;font-weight:600;color:#291c15;font-variant-numeric:tabular-nums">{{summaryDuration}} · {{summaryPrice}}</div>
          </div>
          <button onClick="{{goStep2}}" style="padding:13px 30px;border-radius:999px;border:none;background:#482a1d;color:#fdf8f1;font-family:Manrope,sans-serif;font-size:14px;font-weight:700;cursor:pointer;min-height:44px;flex-shrink:0">Далее</button>
        </div>
      </sc-if>
      <sc-if value="{{noSelection}}" hint-placeholder-val="{{true}}">
        <button disabled style="padding:13px 30px;border-radius:999px;border:none;background:#e4dcd3;color:#a59c98;font-family:Manrope,sans-serif;font-size:14px;font-weight:700;cursor:not-allowed;min-height:44px">Далее</button>
      </sc-if>
    </div>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    category: 0,
    selected: {},
    demoOverride: null,
  };

  setCat0 = () => this.setState({ category: 0 });
  setCat1 = () => this.setState({ category: 1 });
  setCat2 = () => this.setState({ category: 2 });
  setCat3 = () => this.setState({ category: 3 });

  toggle = (id) => this.setState(s => {
    const sel = { ...s.selected };
    if (sel[id]) delete sel[id]; else sel[id] = true;
    return { selected: sel, demoOverride: null };
  });

  setDemo0 = () => this.setState({ selected: {}, demoOverride: 0 });
  setDemo1 = () => this.setState({ selected: { haircut: true }, demoOverride: 1 });
  setDemo2 = () => this.setState({ selected: { haircut: true, color: true }, demoOverride: 2 });

  goHome = () => { location.href = './Landing my B.S..dc.html'; };
  goStep2 = () => { location.href = './Booking · 2 · Мастер.dc.html'; };

  renderVals() {
    const s = this.state;
    const categories = ['Стрижка', 'Окрашивание', 'Уход', 'Укладка'];

    const allServices = [
      { id: 'haircut', cat: 0, name: 'Стрижка', desc: 'Мытьё, стрижка, укладка', duration: '45 мин', durationMin: 45, price: 2800, priceLabel: '2 800 ₽' },
      { id: 'trim', cat: 0, name: 'Коррекция кончиков', desc: 'Лёгкое обновление длины', duration: '25 мин', durationMin: 25, price: 1500, priceLabel: '1 500 ₽' },
      { id: 'color', cat: 1, name: 'Окрашивание', desc: 'Балаяж, тонирование, седина', duration: '2 ч 15 мин', durationMin: 135, price: 7500, priceLabel: '7 500 ₽' },
      { id: 'toning', cat: 1, name: 'Тонирование', desc: 'Освежение оттенка без осветления', duration: '1 ч', durationMin: 60, price: 3200, priceLabel: '3 200 ₽' },
      { id: 'mask', cat: 2, name: 'Уход и маски', desc: 'Восстановление и питание волос', duration: '30 мин', durationMin: 30, price: 1900, priceLabel: '1 900 ₽' },
      { id: 'scalp', cat: 2, name: 'Уход за кожей головы', desc: 'Глубокое очищение и увлажнение', duration: '20 мин', durationMin: 20, price: 1600, priceLabel: '1 600 ₽' },
      { id: 'styling', cat: 3, name: 'Укладка', desc: 'На волосы любой длины', duration: '30 мин', durationMin: 30, price: 1500, priceLabel: '1 500 ₽' },
      { id: 'blowout', cat: 3, name: 'Мытьё и стайлинг', desc: 'Быстрое обновление образа', duration: '20 мин', durationMin: 20, price: 900, priceLabel: '900 ₽' },
    ];

    const cardBase = "background:#fef9f3;border-radius:20px;padding:18px;cursor:pointer;transition:border-color .15s ease,box-shadow .15s ease;";
    const cardDefault = cardBase + "border:1.5px solid #d6ccc4;";
    const cardSelected = cardBase + "border:2px solid #8d671d;box-shadow:0 0 0 3px #f5e2c4;";
    const checkDefault = "width:22px;height:22px;border-radius:50%;border:1.5px solid #a4958c;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent";
    const checkSelected = "width:22px;height:22px;border-radius:50%;border:1.5px solid #8d671d;background:#8d671d;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fdf8f1;font-weight:700";

    const visible = allServices.filter(sv => sv.cat === s.category);
    const services = visible.map(sv => ({
      name: sv.name, desc: sv.desc, duration: sv.duration, price: sv.priceLabel,
      cardStyle: s.selected[sv.id] ? cardSelected : cardDefault,
      checkStyle: s.selected[sv.id] ? checkSelected : checkDefault,
      toggle: () => this.toggle(sv.id),
    }));

    const selectedList = allServices.filter(sv => s.selected[sv.id]);
    const count = selectedList.length;
    const totalMin = selectedList.reduce((sum, sv) => sum + sv.durationMin, 0);
    const totalPrice = selectedList.reduce((sum, sv) => sum + sv.price, 0);
    const roundedHalfHours = Math.round(totalMin / 30) * 30;
    const hours = roundedHalfHours / 60;
    const durationLabel = totalMin >= 60 ? (hours % 1 === 0 ? hours + ' ч' : Math.floor(hours) + ' ч ' + (roundedHalfHours % 60) + ' мин') : totalMin + ' мин';

    const tabBase = "padding:9px 18px;border-radius:999px;border:none;font-family:Manrope,sans-serif;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;";
    const tabActive = tabBase + "background:#fef9f3;color:#291c15;";
    const tabInactive = tabBase + "background:transparent;color:#796c65;";

    const devBtnBase = "padding:8px 16px;border-radius:999px;border:1px solid #d6ccc4;background:#fef9f3;color:#796c65;font-family:Manrope,sans-serif;font-size:12px;font-weight:700;cursor:pointer";
    const devBtnActive = "padding:8px 16px;border-radius:999px;border:1px solid #482a1d;background:#482a1d;color:#fdf8f1;font-family:Manrope,sans-serif;font-size:12px;font-weight:700;cursor:pointer";

    return {
      catStyle0: s.category === 0 ? tabActive : tabInactive,
      catStyle1: s.category === 1 ? tabActive : tabInactive,
      catStyle2: s.category === 2 ? tabActive : tabInactive,
      catStyle3: s.category === 3 ? tabActive : tabInactive,
      setCat0: this.setCat0, setCat1: this.setCat1, setCat2: this.setCat2, setCat3: this.setCat3,
      services,
      hasSelection: count > 0, noSelection: count === 0,
      summaryCount: count === 1 ? '1 услуга' : count + ' услуги',
      summaryDuration: durationLabel,
      summaryPrice: totalPrice.toLocaleString('ru-RU') + ' ₽',
      setDemo0: this.setDemo0, setDemo1: this.setDemo1, setDemo2: this.setDemo2,
      goHome: this.goHome, goStep2: this.goStep2,
      devBtn0: s.demoOverride === 0 ? devBtnActive : devBtnBase,
      devBtn1: s.demoOverride === 1 ? devBtnActive : devBtnBase,
      devBtn2: s.demoOverride === 2 ? devBtnActive : devBtnBase,
    };
  }
}
</script>
</body>
</html>
